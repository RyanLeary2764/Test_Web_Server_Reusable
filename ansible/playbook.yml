---
- name: Configure the website preview
  hosts: all
  become: true
  gather_facts: false
  vars:
    site_root: /opt/silipos-preview
  pre_tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
    - name: Gather system facts
      ansible.builtin.setup:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
  tasks:
    - name: Install Docker and Python HTTP support
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-requests
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
    - name: Create website directories
      ansible.builtin.file:
        path: "{{ site_root }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - html
        - nginx
    - name: Copy HTML and assets
      when: image_archive is not defined
      ansible.builtin.copy:
        src: ../html/
        dest: "{{ site_root }}/html/"
        owner: root
        group: root
        mode: '0644'
        directory_mode: '0755'
    - name: Copy Nginx configuration
      when: image_archive is not defined
      ansible.builtin.copy:
        src: ../nginx/default.conf
        dest: "{{ site_root }}/nginx/default.conf"
        owner: root
        group: root
        mode: '0644'
      notify: Restart preview
    - name: Upload tested CI image
      when: image_archive is defined
      ansible.builtin.copy:
        src: "{{ image_archive }}"
        dest: "{{ site_root }}/website-image.tar.gz"
        mode: '0600'
    - name: Load tested CI image into Docker
      when: image_archive is defined
      community.docker.docker_image_load:
        path: "{{ site_root }}/website-image.tar.gz"
    - name: Remove uploaded image archive
      when: image_archive is defined
      ansible.builtin.file:
        path: "{{ site_root }}/website-image.tar.gz"
        state: absent
    - name: Run the Nginx container
      community.docker.docker_container:
        name: silipos-preview
        image: "{{ nginx_image | default('nginx:stable-alpine') }}"
        pull: "{{ 'never' if image_archive is defined else 'missing' }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "80:80"
        volumes: "{{ [] if image_archive is defined else [site_root + '/html:/usr/share/nginx/html:ro', site_root + '/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'] }}"
        log_driver: json-file
        log_options:
          max-size: 10m
          max-file: '3'
    - name: Apply configuration changes before checking HTTP
      ansible.builtin.meta: flush_handlers
    - name: Verify the website responds
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
      register: preview_check
      retries: 10
      delay: 2
      until: preview_check.status == 200
  handlers:
    - name: Restart preview
      community.docker.docker_container:
        name: silipos-preview
        state: started
        restart: true
