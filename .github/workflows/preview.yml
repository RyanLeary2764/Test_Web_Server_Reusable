name: Website preview

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-infrastructure
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible
        run: |
          pip install -r ansible/requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Validate configuration
        run: |
          docker compose config --quiet
          ansible-playbook -i 'localhost,' ansible/playbook.yml --syntax-check
          bash -n scripts/deploy.sh scripts/prepare-infra.sh
          python -m py_compile scripts/prepare-ci.py scripts/prepare-runtime.py
      - name: Build and smoke test website image
        env:
          IMAGE_TAG: silipos-preview:${{ github.sha }}
        run: |
          docker build --tag "$IMAGE_TAG" .
          docker run --detach --name preview-test --publish 127.0.0.1:8080:80 "$IMAGE_TAG"
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:8080/ -o /tmp/served.html
          diff html/index.html /tmp/served.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ci-missing-${{ github.sha }})" = 404
          docker save "$IMAGE_TAG" | gzip > website-image.tar.gz
      - name: Container logs
        if: failure()
        run: docker logs preview-test || true
      - name: Stop test container
        if: always()
        run: docker rm --force preview-test || true
      - uses: actions/upload-artifact@v4
        with:
          name: website-image
          path: website-image.tar.gz
          retention-days: 3
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PREVIEW_DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: preview
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_allowed_cidr: ${{ vars.PREVIEW_ALLOWED_CIDR }}
      ANSIBLE_HOST_KEY_CHECKING: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: website-image
          path: image
      - name: Install Ansible
        run: |
          pip install -r ansible/requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PROVISION_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: Prepare shared infrastructure configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          PREVIEW_ALLOWED_CIDR: ${{ vars.PREVIEW_ALLOWED_CIDR }}
        run: bash scripts/prepare-infra.sh
      - name: Create or update preview server
        run: |
          terraform -chdir="$RUNNER_TEMP/preview-infra" init -backend-config="bucket=$TF_STATE_BUCKET"
          terraform -chdir="$RUNNER_TEMP/preview-infra" validate
          terraform -chdir="$RUNNER_TEMP/preview-infra" plan -out=preview.tfplan
          terraform -chdir="$RUNNER_TEMP/preview-infra" apply -auto-approve preview.tfplan
          terraform -chdir="$RUNNER_TEMP/preview-infra" output -json > "$RUNNER_TEMP/preview-outputs.json"
      - name: Verify SSH host key through AWS and prepare inventory
        env:
          IMAGE_TAG: silipos-preview:${{ github.sha }}
        run: python scripts/prepare-runtime.py
      - name: Temporarily allow runner SSH
        run: |
          RUNNER_IP=$(curl -4 --fail --silent --show-error https://checkip.amazonaws.com)
          python -c 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])' "$RUNNER_IP"
          GROUP_ID=$(terraform -chdir="$RUNNER_TEMP/preview-infra" output -raw preview_security_group_id)
          echo "SECURITY_GROUP_ID=$GROUP_ID" >> "$GITHUB_ENV"
          RULE_ID=$(aws ec2 authorize-security-group-ingress --group-id "$GROUP_ID" --protocol tcp --port 22 --cidr "$RUNNER_IP/32" --query 'SecurityGroupRules[0].SecurityGroupRuleId' --output text)
          echo "RUNNER_RULE_ID=$RULE_ID" >> "$GITHUB_ENV"
      - name: Deploy tested image with Ansible
        run: |
          ansible-playbook -i "$RUNNER_TEMP/preview-deploy/inventory.json"             --private-key "$RUNNER_TEMP/preview-deploy/id_ed25519"             --ssh-common-args "-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/preview-deploy/known_hosts"             --extra-vars "@$RUNNER_TEMP/preview-deploy/vars.json" ansible/playbook.yml
      - name: Publish preview URL
        run: |
          URL=$(terraform -chdir="$RUNNER_TEMP/preview-infra" output -raw preview_url)
          echo "Preview website: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Access is restricted to PREVIEW_ALLOWED_CIDR. Use the Destroy website preview workflow to remove it." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner SSH access
        if: always() && env.RUNNER_RULE_ID != ''
        run: aws ec2 revoke-security-group-ingress --group-id "$SECURITY_GROUP_ID" --security-group-rule-ids "$RUNNER_RULE_ID"
      - name: Remove temporary deployment credentials
        if: always()
        run: |
          python scripts/prepare-ci.py --cleanup
          rm -f "$RUNNER_TEMP/preview-key" "$RUNNER_TEMP/preview-key.pub"
